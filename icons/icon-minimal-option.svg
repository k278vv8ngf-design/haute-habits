<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Haute Habits app icon, minimal version: a plate with the Hh monogram. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a33c2"/>
      <stop offset="0.5" stop-color="#5a2196"/>
      <stop offset="1" stop-color="#2b170b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" fx="0.38" fy="0.32">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#D9C7F2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A478D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8E5737" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8E5737" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="400" cy="110" r="170" fill="url(#glow)"/>
  <circle cx="70" cy="470" r="190" fill="url(#warm)"/>
  <!-- Plate -->
  <circle cx="256" cy="256" r="172" fill="url(#plate)" stroke="#fffdf9" stroke-opacity="0.95" stroke-width="8"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#D9C7F2" stroke-opacity="0.8" stroke-width="4"/>
  <!-- Monogram -->
  <text x="232" y="302" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
        font-size="160" fill="#fffdf9">H</text>
  <text x="309" y="316" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
        font-style="italic" font-size="160" fill="#D9C7F2">h</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
